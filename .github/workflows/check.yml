name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Lint scripts
        run: make check

      - name: Build camera helper
        run: make build

      - name: Run camera helper
        run: ./build/camera-in-use
